name: Python Tests

on:
  # No base-branch filter: stacked PRs (e.g. targeting a feature branch)
  # must get checks too, not just PRs into main.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Recommender tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Verify package imports
        run: |
          python - <<'PY'
          from core import recommend_size
          from core.recommender import recommend_size as recommend_size_direct
          assert callable(recommend_size)
          assert callable(recommend_size_direct)
          print("Import check passed")
          PY

      - name: Verify recommender demo output is valid JSON
        run: |
          python -m core.recommender > /tmp/recommender_demo.json
          python -m json.tool /tmp/recommender_demo.json > /dev/null
          echo "Recommender demo JSON check passed"

  backend-test:
    name: Backend API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12 on purpose: matches the python:3.12-slim base image in
          # backend/Dockerfile, so CI tests the runtime that actually ships.
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend test suite
        run: python -m pytest -q

      - name: Smoke - seeded API boots and serves the golden path
        run: |
          python -m scripts.seed
          python -m scripts.ingest_analysis
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/products | python -m json.tool > /dev/null
          curl -sf -X POST http://127.0.0.1:8000/api/recommend \
            -H "Content-Type: application/json" \
            -d '{"product_id": 2, "fit_pref": "regular", "measurements": {"waist": 79, "hips": 92, "inseam": 85}}' \
            | python -m json.tool
          echo "Backend golden-path smoke passed"

  docker-build:
    # The submission requires `docker compose up` to work on a clean machine;
    # this proves the image builds (incl. build-time seeding) on every PR.
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the compose stack
        run: docker compose build

      - name: Boot and health-check the API container
        run: |
          docker compose up -d api
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health | python3 -m json.tool
          docker compose down