# FitOS stack. `cp .env.example .env && docker compose up` boots the full demo:
# API on :8000 (image is built with a seeded SQLite DB + pre-mined reviews) and
# the frontend on :5173.
services:
  api:
    build:
      # Repo root as context: the image needs both backend/ and the shared
      # engine package core/. Filtering happens in the root .dockerignore.
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Optional: works offline without an .env (falls back to keyword mining +
      # template explanations). Provide keys to enable AMD vLLM / Fireworks.
      - path: .env
        required: false

  web:
    build:
      context: ./frontend
      # The browser calls the API directly, so for a REMOTE demo (AMD box)
      # rebuild with the public origin:
      #   docker compose build --build-arg VITE_API_BASE=http://<host>:8000 web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - api
